<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#2a3034"/>
      <stop offset="55%" stop-color="#4a5356"/>
      <stop offset="100%" stop-color="#8a8f88"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d726c"/>
      <stop offset="100%" stop-color="#2c2e2c"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <ellipse cx="1180" cy="420" rx="260" ry="18" fill="#c5c8c0" opacity="0.18"/>
  <rect y="620" width="1600" height="380" fill="url(#ground)"/>
  <path d="M0 640 C 280 580, 520 700, 820 640 S 1280 560, 1600 610 L1600 1000 L0 1000 Z" fill="#3a3d3a" opacity="0.7"/>
  <rect x="720" y="430" width="42" height="220" fill="#d8d6cc" opacity="0.55"/>
  <rect x="764" y="470" width="28" height="180" fill="#b7b3a8" opacity="0.4"/>
  <rect width="1600" height="1000" filter="url(#grain)"/>
  <rect width="1600" height="1000" fill="#0c0d0f" opacity="0.18"/>
</svg>
